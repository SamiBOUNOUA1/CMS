# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # Chromium (used for WhatsApp PDF generation) needs more CPU/memory than the default.
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets.
env:
  # Cloud Storage bucket used for inventory image uploads.
  # Verify the exact name in Firebase Console → Storage (the gs:// bucket).
  # Modern projects use <project>.firebasestorage.app; older ones use <project>.appspot.com.
  - variable: STORAGE_BUCKET
    value: catero-10f39.firebasestorage.app
    availability:
      - RUNTIME

  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Secrets from Cloud Secret Manager.
  # Create each with `firebase apphosting:secrets:set <NAME>` before deploying.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters

  # Needed at build time too: src/lib/mongodb.ts throws on import if it's missing.
  - variable: MONGODB_URI
    secret: MONGODB_URI
    availability:
      - BUILD
      - RUNTIME

  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - BUILD
      - RUNTIME

  # Encrypts users' 2FA secrets in the DB. Keep it stable: changing it breaks
  # existing 2FA enrollments. Lets JWT_SECRET be rotated independently.
  - variable: MFA_ENCRYPTION_KEY
    secret: MFA_ENCRYPTION_KEY
    availability:
      - RUNTIME
