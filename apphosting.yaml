# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # Chromium (used for WhatsApp PDF generation) needs more CPU/memory than the default.
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets.
env:
  # Cloud Storage bucket used for inventory image uploads.
  # Verify the exact name in Firebase Console → Storage (the gs:// bucket).
  # Modern projects use <project>.firebasestorage.app; older ones use <project>.appspot.com.
  - variable: STORAGE_BUCKET
    value: catero-10f39.firebasestorage.app
    availability:
      - RUNTIME

  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Secrets from Cloud Secret Manager.
  # Create each with `firebase apphosting:secrets:set <NAME>` before deploying.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters

  # Needed at build time too: src/lib/mongodb.ts throws on import if it's missing.
  - variable: MONGODB_URI
    secret: MONGODB_URI
    availability:
      - BUILD
      - RUNTIME

  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - BUILD
      - RUNTIME

  # Encrypts users' 2FA secrets in the DB. Keep it stable: changing it breaks
  # existing 2FA enrollments. Lets JWT_SECRET be rotated independently.
  - variable: MFA_ENCRYPTION_KEY
    secret: MFA_ENCRYPTION_KEY
    availability:
      - RUNTIME

  # ── Email (see README "Email reminders") ──────────────────────────────────
  # Daily reminders are turned off for now. To turn them on: create the secret
  # (see README "Daily reminder job"), uncomment this block, and add the
  # Cloud Scheduler job. While it's off, /api/cron/reminders always answers 401.
  # - variable: CRON_SECRET
  #   secret: CRON_SECRET
  #   availability:
  #     - RUNTIME

  # Platform email service (Resend over SMTP), used by tenants who pick
  # "platform" mode. Tenants can also use their own SMTP.
  - variable: PLATFORM_SMTP_HOST
    value: smtp.resend.com
    availability:
      - RUNTIME
  - variable: PLATFORM_SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  # TODO: @resend.dev only delivers to your own Resend account address.
  # Verify your domain in Resend → Domains and change this to e.g. no-reply@your-domain.com.
  - variable: PLATFORM_SMTP_FROM
    value: catero@resend.dev
    availability:
      - RUNTIME
  # Resend's SMTP username is always "resend".
  - variable: PLATFORM_SMTP_USER
    value: resend
    availability:
      - RUNTIME
  # Your Resend API key (re_...). Never put it in this file.
  - variable: PLATFORM_SMTP_PASS
    secret: PLATFORM_SMTP_PASS
    availability:
      - BUILD
      - RUNTIME

  # Public URL used in password reset emails (e.g. https://app.your-domain.com).
  # Optional: without it, links are built from the request's host header.
  # - variable: APP_BASE_URL
  #   value: https://app.your-domain.com
  #   availability:
  #     - RUNTIME
